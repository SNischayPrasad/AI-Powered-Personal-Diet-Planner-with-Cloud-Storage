# Render Blueprint — deployment approach A (free tier).
#
# Render dashboard → New → Blueprint → pick this repository. Render builds the Dockerfile
# (React frontend + FastAPI API in one container) and redeploys on every push to main.
#
# Free web services sleep after ~15 minutes idle and have no persistent disk, so point the app
# at a managed database and bucket: fill in the `sync: false` values in the dashboard.
# See docs/15-cloud-deployment.md for step-by-step instructions.

services:
  - type: web
    name: ai-diet-planner
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Random signing key generated by Render once, stored encrypted, never in Git.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Only needed for a frontend on another origin that calls this API directly (e.g. Vercel).
      # The Cloudflare Worker proxies /api on the same origin, so it works either way.
      - key: CORS_ORIGINS
        sync: false
      # Cloud database: Supabase / Neon pooled PostgreSQL connection string.
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      # Cloud object storage: Cloudflare R2 (endpoint https://<account-id>.r2.cloudflarestorage.com,
      # region auto) / Supabase Storage / AWS S3.
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_BUCKET
        value: diet-planner-files
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      # AI: rule_based needs no key. Switch to anthropic / openai_compatible and add the key.
      - key: AI_PROVIDER
        value: rule_based
      - key: ANTHROPIC_API_KEY
        sync: false
