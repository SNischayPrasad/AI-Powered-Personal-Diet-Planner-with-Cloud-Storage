# Continuous integration: every push and pull request is linted, tested and built.
# Hosting platforms (Render, Vercel) deploy from `main` separately (continuous deployment),
# so a red pipeline here is the signal not to merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python ${{ matrix.python-version }} · SQLite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (style, bugs and security checks)
        run: ruff check .
      - name: Unit and API tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  backend-postgres:
    name: Backend · PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway credentials for an ephemeral CI container that only this job can reach.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: dietplanner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d dietplanner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci:ci-only-throwaway@localhost:5432/dietplanner_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Full test suite against PostgreSQL
        run: pytest

  frontend:
    name: Frontend · Node 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Start the API
        env:
          JWT_SECRET_KEY: ci-smoke-test-signing-key-not-used-anywhere-else-0123456789
        run: |
          uvicorn backend.app:app --port 8000 > api.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && break
            sleep 1
          done
      - name: Run the smoke test
        run: python scripts/smoke_test.py --base-url http://localhost:8000
      - name: API log
        if: always()
        run: cat api.log
