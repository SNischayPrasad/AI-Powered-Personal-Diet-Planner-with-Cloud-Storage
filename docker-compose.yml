# Local "virtual cloud" for development — requires Docker Desktop.
#
#   docker compose up -d postgres s3 s3-init
#
# PostgreSQL stands in for a managed cloud database (Supabase / Neon / AWS RDS) and RustFS, an
# open-source S3-compatible server, for object storage (AWS S3 / Supabase Storage / R2).
# Credentials come from your .env file (see .env.example) — nothing is hard-coded.
# Then point the API at them (in .env):
#   DATABASE_URL=postgresql://dietplanner:<POSTGRES_PASSWORD>@localhost:5432/dietplanner
#   STORAGE_PROVIDER=s3
#   S3_ENDPOINT_URL=http://localhost:9000
#   S3_ACCESS_KEY_ID=<RUSTFS_ACCESS_KEY>
#   S3_SECRET_ACCESS_KEY=<RUSTFS_SECRET_KEY>
#   S3_FORCE_PATH_STYLE=true
# Bucket browser (web console): http://localhost:9001
#
# Or run the whole stack in containers, exactly as it ships to the cloud (Dockerfile):
#   docker compose --profile app up --build        → http://localhost:8000

services:
  # The production image (React build + FastAPI) wired to the local "cloud" services.
  app:
    profiles: ["app"]
    build: .
    environment:
      ENVIRONMENT: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY (32+ random characters) in your .env file}
      CORS_ORIGINS: http://localhost:8000
      DATABASE_URL: postgresql://dietplanner:${POSTGRES_PASSWORD}@postgres:5432/dietplanner
      STORAGE_PROVIDER: s3
      STORAGE_BUCKET: ${STORAGE_BUCKET:-diet-planner-files}
      S3_ENDPOINT_URL: http://s3:9000
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      AI_PROVIDER: ${AI_PROVIDER:-rule_based}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dietplanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: dietplanner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dietplanner -d dietplanner"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage (Apache-2.0). The app talks to it with the same boto3 code
  # it uses for AWS S3 — only S3_ENDPOINT_URL differs.
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in your .env file}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in your .env file}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # web console
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot job: create the private bucket the app uses (like provisioning it in the cloud),
  # with the official AWS CLI — the same command works against real S3.
  s3-init:
    image: amazon/aws-cli:2.37.3
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      STORAGE_BUCKET: ${STORAGE_BUCKET:-diet-planner-files}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$STORAGE_BUCKET" 2>/dev/null
        || aws --endpoint-url http://s3:9000 s3api create-bucket --bucket "$$STORAGE_BUCKET"

volumes:
  pgdata:
  s3data:
